<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "popins", sans-serif;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: darkolivegreen;
            }
            .container {
                width: 380px;
                height: 90vh;
                background-color: #fff;
                border-radius: 10px;
            }
            .btn-o {
                display: flex;
                justify-content: flex-end;
                width: 100%;
                height: 10vh;
                align-items: center;
                padding-right: 15px;
                border-bottom: 1px solid #ccc;
            }
            .btn-o button {
                background-color: blueviolet;
                border: none;
                padding: 7px 25px;
                border-radius: 5px;
                color: white;
            }   
            .btn-o button:hover {
                background-color: brown;
                cursor: pointer;
            }
            .menu {
                height: 80vh;
                border-radius: 0px 0px 0px 10px;
                background-color: blueviolet;
                width: 250px;
                display: none;
            }
            .btn-c {
                display: flex;
                width: 100%;
                justify-content: flex-end;
                align-items: center;
                padding-right: 15px;
            }
            .btn-c button {
                background: none;
                border: none;
                font-size: 18px;
                font-weight: bold;
                color: white;
            }
            .btn-c button:hover {
                cursor: pointer;
                color: brown
            }
            ul {
                list-style: none;
                padding: 15px;
                color: white
            }
            li {
                margin-bottom: 30px;
                cursor: pointer;
            }
        </style
    </head>

    <body>
        <div class="container">
            <div class="btn-o"><button onclick="openMenu()">menu</button></div>
            <div class="menu" id="menu">
                <div class="btn-c"><button onclick="closeMenu()">x</button></div>
                <ul>
                    <li><a>Home</a></li>
                    <li><a>Contact</a></li>
                    <li><a>About</a></li>
                </ul>
            </div>
        </div>
        <script>
            var menu = document.getElementById("menu");
            function openMenu(){
                menu.style.display = "block";
            }
            function closeMenu(){
                menu.style.display = "none";
            }
        </script>  
    </body>                  
</html>
